plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
    id"com.gradleup.shadow" version "9.1.0"
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}


repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = "Essential-Repo"
        url = "https://repo.essential.gg/public"
    }
}

// Partner mod configurations - ONLY these change between builds
// MC version and Fabric API version come from gradle.properties
def partnerModConfigs = [
    '1.21.8': 'gg.essential:partner-mod-integration-1.21.8-fabric:1.0.6',
    '1.21.9': 'gg.essential:partner-mod-integration-1.21.9-fabric:1.0.6',
    '1.21.10': 'gg.essential:partner-mod-integration-1.21.9-fabric:1.0.6',
    '1.21.11': 'gg.essential:partner-mod-integration-1.21.11-fabric:1.0.6'
]

// Determine which partner mod version to include (from -PpartnerVersion, defaults to MC version from gradle.properties)
def partnerVersion = project.hasProperty('partnerVersion') ? project.partnerVersion : project.minecraft_version
def partnerModDependency = partnerModConfigs[partnerVersion]
if (partnerModDependency == null) {
    throw new GradleException("Unknown partner mod version: ${partnerVersion}. Supported: ${partnerModConfigs.keySet()}")
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    // ALWAYS use MC version and Fabric API version from gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    shade 'org.apache.httpcomponents:httpclient:4.5.14'
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // ONLY change the partner mod version - use modImplementation (not bundled, separate mod dependency)
    include partnerModDependency
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "max_minecraft_version", project.max_minecraft_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "max_minecraft_version": project.max_minecraft_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// Configure shadowJar to include only httpclient (partner mod is separate via modImplementation)
shadowJar {
    archiveClassifier.set("dev-${partnerVersion}")
    configurations = [project.configurations.shade]

    relocate 'org.apache.http', 'club.sk1er.mods.autotip.shaded.org.apache.http'
    relocate 'org.apache.commons.logging', 'club.sk1er.mods.autotip.shaded.org.apache.commons.logging'
    relocate 'org.apache.commons.codec', 'club.sk1er.mods.autotip.shaded.org.apache.commons.codec'
}

// Remap the shadowed jar with partner version-specific name
remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
    archiveClassifier.set(partnerVersion)
}

// Print build info
tasks.named('remapJar').configure {
    doLast {
        println "\n✓ Built Autotip"
        println "  MC Version (build): ${project.minecraft_version}"
        println "  Partner Mod Version: ${partnerVersion}"
        println "  Output: ${archiveFile.get().asFile.name}"
        println "  Location: ${archiveFile.get().asFile.path}\n"
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
